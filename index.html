<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
        Tic Tac Toe
    </header>

    <main>

        <div class="game-status">X's turn</div>
        <div class="gameboard">
            <div class="board-box" id="_0">X</div>
            <div class="board-box" id="_1"></div>
            <div class="board-box" id="_2"></div>
            <div class="board-box" id="_3"></div>
            <div class="board-box" id="_4"></div>
            <div class="board-box" id="_5"></div>
            <div class="board-box" id="_6"></div>
            <div class="board-box" id="_7"></div>
            <div class="board-box" id="_8"></div>
        </div>
        <div class="options">2 Player</div>
        <button id="start-restart-btn">Start</button>

    </main>

    <!-- <script src="script.js"></script> -->
</body>
</html>
