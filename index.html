<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe!</title>
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <header>
        Tic Tac Toe
    </header>

    <main>

        <div class="game-status">Press start to begin</div>
        <div class="gameboard">
            <div class="board-box" id="_0"></div>
            <div class="board-box" id="_1"></div>
            <div class="board-box" id="_2"></div>
            <div class="board-box" id="_3"></div>
            <div class="board-box" id="_4"></div>
            <div class="board-box" id="_5"></div>
            <div class="board-box" id="_6"></div>
            <div class="board-box" id="_7"></div>
            <div class="board-box" id="_8"></div>
        </div>

        <div class="score-board">
            <div class="player-score">
                <div class="score-title">
                    Player 1 (<span id="player-one-marker">X</span>)
                </div>
                <div id="player-one-score">0</div>
            </div>

            <div class="player-score">
                <div class="score-title">Tie</div>
                <div id="tie-score">0</div>
            </div>

            <div class="player-score">
                <div class="score-title">
                    Player 2 (<span id="player-two-marker">O</span>)
                </div>
                <div id="player-two-score">0</div>
            </div>
            
        </div>

        <button id="start-restart-btn">Start</button>

    </main>

    <script src="script.js" defer></script>
</body>
</html>
